[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "advertest-ml-core"
version = "0.1.0"
description = "Perception robustness evaluation core for AdverTest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
  "Pillow>=11.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]

[project.scripts]
advertest-ml = "advertest_ml_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
